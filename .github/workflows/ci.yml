# =============================================================================
# ci.yml — Continuous Integration for agent-resource-catalog
#
# Triggers:
#   - Push to main
#   - Pull requests targeting main
#
# Jobs:
#   validate      — Schema-validate all catalog entries
#   build-catalog — Rebuild catalog.json / marketplace.json; auto-commit on main
#   release       — Create a GitHub Release with plugin zips (tag pushes only)
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same ref so new pushes don't queue up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: validate
  # Validate all JSON/YAML catalog files against their schemas.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Run schema validation
        run: python scripts/validate.py

  # ---------------------------------------------------------------------------
  # Job 2: build-catalog
  # Rebuild catalog.json and .claude-plugin/marketplace.json.
  # On pushes to main, commit the updated files back to the repo.
  # Uses [skip ci] in the commit message to prevent infinite CI loops.
  # ---------------------------------------------------------------------------
  build-catalog:
    name: Build catalog
    runs-on: ubuntu-latest
    needs: validate

    # Allow the job to push commits back on main
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # fetch-depth: 0 gives full history — needed so git remote detection
        # and tag resolution work correctly inside build-catalog.py
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Build catalog
        run: python scripts/build-catalog.py --ref ${{ github.ref_name }}

      # Only commit + push on direct pushes to main (not on PRs, not on tags)
      - name: Commit and push updated catalog files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json .claude-plugin/marketplace.json
          # Only commit if there are staged changes; the trailing true prevents
          # the step from failing when nothing changed.
          git diff --cached --quiet || git commit -m "chore: rebuild catalog.json [skip ci]"
          git push

  # ---------------------------------------------------------------------------
  # Job 3: release
  # On version tag pushes (v*), build plugin zip archives and publish a
  # GitHub Release with auto-generated release notes.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate

    # Only run when a version tag is pushed
    if: startsWith(github.ref, 'refs/tags/')

    # Allow the job to create releases and upload assets
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Build catalog for release tag
        run: python scripts/build-catalog.py --ref ${{ github.ref_name }}

      - name: Package plugin directories into zip archives
        run: |
          mkdir -p dist

          # Iterate over every top-level directory under plugins/ and zip each one.
          # The zip is created from *inside* the plugins/ directory so that the
          # archive contains   <plugin-name>/...   at its root (not plugins/<plugin-name>/...).
          for plugin_dir in plugins/*/; do
            plugin_name="$(basename "$plugin_dir")"
            echo "Packaging plugin: $plugin_name"
            (cd plugins && zip -r "../dist/${plugin_name}.zip" "${plugin_name}/")
          done

          echo "--- dist/ contents ---"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Upload every plugin zip and the rebuilt catalog.json
          files: |
            dist/*.zip
            catalog.json
          # Let GitHub auto-generate release notes from merged PRs and commits
          generate_release_notes: true
